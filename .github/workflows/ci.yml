name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache MongoDB binary (API tests run on mongodb-memory-server)
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (known vulnerabilities, moderate and up)
        run: pnpm audit --audit-level moderate
      - run: pnpm format:check
      - run: pnpm build:shared
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test with coverage (fails under 80% lines)
        run: pnpm test:cov
      - run: pnpm build

  e2e:
    name: Playwright (full stack)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache MongoDB binary (the API runs on mongodb-memory-server)
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @auth-app/e2e install-browsers
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  stack:
    name: Docker Compose stack (production mode)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Every browser test signs in from the same address.
      AUTH_THROTTLE_LIMIT: '1000'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: ./scripts/init-env.sh
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify access control, closed API docs and security headers
        run: ./scripts/verify-stack.sh
      - run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
      - run: pnpm --filter @auth-app/e2e install-browsers
      - name: Run the browser tests against the stack
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color
