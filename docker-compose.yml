# Full stack: docker compose up --build   →   http://localhost:8080
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      # Local development and e2e tests only: bound to this machine, never the network.
      # A shared or internet-facing deployment should also enable MongoDB authentication.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/auth-app
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32)}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # Plain HTTP on localhost here. Behind HTTPS in production, leave the default (true).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: 1 # nginx
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Swagger UI at /api/docs. Off by default when NODE_ENV=production; on here for reviewers.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # Sign-in/sign-up attempts per IP per minute. Raise it only to run e2e tests against this stack.
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-5}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  mongo-data:
